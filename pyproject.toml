[project]
name = "englishish"
version = "0.1.0"
description = "An alternate vocabulary as close to English as possible without being English"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Hugh Wimberly", email = "hugh.wimberly@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rapidfuzz>=3.14.5",
    "wordfreq>=3.1.1",
]


[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
